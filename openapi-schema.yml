components:
  schemas:
    Alert:
      type: object
      description: Serializer for Alert model
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        rule:
          type: string
          format: uuid
        rule_name:
          type: string
          readOnly: true
        triggered_for_user_id:
          type: string
          format: uuid
          nullable: true
        triggered_for_team_id:
          type: string
          format: uuid
          nullable: true
        severity:
          type: string
          maxLength: 20
        title:
          type: string
          maxLength: 255
        message:
          type: string
        is_read:
          type: boolean
        acknowledged_by:
          type: string
          format: uuid
          nullable: true
        acknowledged_at:
          type: string
          format: date-time
          nullable: true
        triggered_at:
          type: string
          format: date-time
          readOnly: true
        status:
          type: string
          maxLength: 20
        context_data: {}
      required:
      - id
      - message
      - rule
      - rule_name
      - severity
      - title
      - triggered_at
    AlertDetail:
      type: object
      description: Detailed serializer for Alert with full alert rule info
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        rule:
          allOf:
          - $ref: '#/components/schemas/AlertRule'
          readOnly: true
        rule_name:
          type: string
          readOnly: true
        triggered_for_user_id:
          type: string
          format: uuid
          nullable: true
        triggered_for_team_id:
          type: string
          format: uuid
          nullable: true
        severity:
          type: string
          maxLength: 20
        title:
          type: string
          maxLength: 255
        message:
          type: string
        is_read:
          type: boolean
        acknowledged_by:
          type: string
          format: uuid
          nullable: true
        acknowledged_at:
          type: string
          format: date-time
          nullable: true
        triggered_at:
          type: string
          format: date-time
          readOnly: true
        status:
          type: string
          maxLength: 20
        context_data: {}
      required:
      - id
      - message
      - rule
      - rule_name
      - severity
      - title
      - triggered_at
    AlertRequest:
      type: object
      description: Serializer for Alert model
      properties:
        rule:
          type: string
          format: uuid
        triggered_for_user_id:
          type: string
          format: uuid
          nullable: true
        triggered_for_team_id:
          type: string
          format: uuid
          nullable: true
        severity:
          type: string
          minLength: 1
          maxLength: 20
        title:
          type: string
          minLength: 1
          maxLength: 255
        message:
          type: string
          minLength: 1
        is_read:
          type: boolean
        acknowledged_by:
          type: string
          format: uuid
          nullable: true
        acknowledged_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          minLength: 1
          maxLength: 20
        context_data: {}
      required:
      - message
      - rule
      - severity
      - title
    AlertRule:
      type: object
      description: Serializer for AlertRule model
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        metric_type:
          type: string
          maxLength: 100
        condition:
          type: string
          maxLength: 50
        threshold_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        is_active:
          type: boolean
        check_interval_minutes:
          type: integer
        company_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company_id
      - condition
      - created_at
      - id
      - metric_type
      - name
      - updated_at
    AlertRuleDetail:
      type: object
      description: Detailed serializer for AlertRule
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        metric_type:
          type: string
          maxLength: 100
        condition:
          type: string
          maxLength: 50
        threshold_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        is_active:
          type: boolean
        check_interval_minutes:
          type: integer
        company_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company_id
      - condition
      - created_at
      - id
      - metric_type
      - name
      - updated_at
    AlertRuleRequest:
      type: object
      description: Serializer for AlertRule model
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        metric_type:
          type: string
          minLength: 1
          maxLength: 100
        condition:
          type: string
          minLength: 1
          maxLength: 50
        threshold_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        is_active:
          type: boolean
        check_interval_minutes:
          type: integer
        company_id:
          type: string
          format: uuid
      required:
      - company_id
      - condition
      - metric_type
      - name
    Notification:
      type: object
      description: Serializer for Notification model
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user_id:
          type: string
          format: uuid
        alert:
          type: string
          format: uuid
        alert_title:
          type: string
          readOnly: true
        notification_type:
          type: string
          maxLength: 20
        subject:
          type: string
          nullable: true
          maxLength: 200
        message:
          type: string
        sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        status:
          type: string
          maxLength: 20
        delivery_metadata: {}
        created_at:
          type: string
